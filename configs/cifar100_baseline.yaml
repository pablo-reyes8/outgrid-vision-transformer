model:
  type: timm
  name: resnet18_cifar
  pretrained: false
  num_classes: 100

training:
  epochs: 100
  optimizer: adamw
  optimizer_betas: [0.9, 0.999]
  optimizer_eps: 0.00000001
  optimizer_momentum: 0.9
  optimizer_nesterov: false
  scheduler: warmup_cosine
  lr: 0.0005
  weight_decay: 0.05
  autocast_dtype: fp16
  use_amp: true
  grad_clip_norm: 1.0
  warmup_ratio: 0.05
  min_lr: 0.000001
  label_smoothing: 0.1
  print_every: 400
  save_path: best_resnet18_cifar.pt
  last_path: last_resnet18_cifar.pt
  resume_path: null
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mix_prob: 0.5
  channels_last: true
  early_stop: false
  early_stop_metric: top1
  early_stop_patience: 10
  early_stop_min_delta: 0.0
  early_stop_require_monotonic: false

data:
  dataset: cifar100
  data_dir: ./data/cifar100
  batch_size: 64
  num_workers: 2
  val_split: 0.1
  pin_memory: true
  img_size: 32
  drop_last: false
  augmentation:
    random_crop: true
    horizontal_flip: true
    randaugment: true
    ra_num_ops: 2
    ra_magnitude: 7
    random_erasing: true
    random_erasing_p: 0.25

runtime:
  device: cuda
  seed: 7
  deterministic: true
  output_dir: outputs/baselines
  evaluate_test: true
  load_best_for_test: true
